# Netlify reads forms from the published HTML after this build. The generators
# write those pages into build/stage, with data-netlify="true" on each lead form.
[build]
  command = "npm run stage"
  publish = "build/stage"

[build.environment]
  NODE_VERSION = "20"

# The contact page file lives at /contact/ for the WordPress build.
# The public address is /contact-us/.
[[redirects]]
  from = "/contact"
  to = "/contact-us/"
  status = 301

[[redirects]]
  from = "/contact/"
  to = "/contact-us/"
  status = 301

# Old WordPress addresses redirected to the pages they became.
[[redirects]]
  from = "/ppc-assets/privacy/"
  to = "/privacy/"
  status = 301
